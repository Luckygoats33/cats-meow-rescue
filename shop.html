<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop All Merch | Cat's Meow Cat Rescue</title>
<meta name="description" content="Shop tees, hoodies, stickers, and magnets to support Cat's Meow Cat Rescue. 100% of proceeds fund cat care.">
<meta name="theme-color" content="#B22222">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="logo-cats-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="logo-cats-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
.shop-hero{background:linear-gradient(135deg,var(--pri),#D43030);color:#fff;padding:clamp(2.5rem,5vw,4rem) clamp(1rem,4vw,3rem);text-align:center}
.shop-hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:.5rem}
.shop-hero p{opacity:.85;max-width:32rem;margin:0 auto;font-size:1rem}

.shop-filters{display:flex;gap:.75rem;flex-wrap:wrap;padding:1.5rem 0;border-bottom:1px solid var(--mist);margin-bottom:2rem;align-items:center}
.filter-label{font-size:.82rem;font-weight:700;color:var(--ink);margin-right:.25rem}
.shop-tab{padding:.45rem 1.25rem;border-radius:var(--radius-pill);font-size:.82rem;font-weight:600;border:1.5px solid var(--mist);background:transparent;color:var(--ink);cursor:pointer;transition:all .2s}
.shop-tab:hover{border-color:var(--pri);color:var(--pri)}
.shop-tab.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;padding-bottom:3rem}
.product-card{background:var(--surface);border:1px solid var(--mist);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s}
.product-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.product-img{position:relative;aspect-ratio:1;overflow:hidden}
.product-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:1.5rem;z-index:1}
.design-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:1rem;color:#fff;text-align:center;background:linear-gradient(0deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.35) 100%)}
.design-text{font-family:var(--serif);font-size:1.4rem;font-weight:800;z-index:2;position:relative;text-shadow:0 2px 8px rgba(0,0,0,.5);letter-spacing:-.02em}
.product-img .design-sub{font-size:.75rem;opacity:.9;font-weight:600;text-transform:uppercase;letter-spacing:.1em;z-index:2;position:relative;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.product-body{padding:1rem}
.product-body h3{font-size:1rem;margin-bottom:.2rem;color:var(--ink)}
.product-price{font-size:1.1rem;font-weight:800;color:var(--pri);display:block;margin-bottom:.75rem}
.size-selector{margin-bottom:.75rem}
.size-select{width:100%;padding:.5rem .75rem;border-radius:8px;border:1.5px solid var(--mist);font-size:.82rem;font-weight:600;color:var(--ink);background:var(--surface);cursor:pointer;transition:border-color .15s;font-family:inherit;appearance:auto}
.size-select:hover,.size-select:focus{border-color:var(--pri);outline:none}
.shop-count{font-size:.85rem;color:var(--stone);margin-left:auto}

@media(max-width:640px){
  .shop-grid{grid-template-columns:1fr 1fr;gap:1rem}
  .product-body{padding:.75rem}
}
@media(max-width:380px){.shop-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="header-mount"></div>


<div class="shop-hero">
  <h1>Rep the Rescue</h1>
  <p>100% of proceeds support Cat's Meow Cat Rescue. Wear your love for cats!</p>
</div>

<main class="container" style="padding-top:1rem;padding-bottom:3rem">
  <div class="shop-filters">
    <span class="filter-label">Filter:</span>
    <button class="shop-tab active" data-tab="all">All</button>
    <button class="shop-tab" data-tab="tees">Tees</button>
    <button class="shop-tab" data-tab="sweats">Sweats</button>
    <button class="shop-tab" data-tab="stickers">Stickers</button>
    <button class="shop-tab" data-tab="magnets">Magnets</button>
    <span class="shop-count" id="shop-count"></span>
  </div>
  <div class="shop-grid" id="shop-grid"></div>
</main>

<div id="footer-mount"></div>

<div class="cart-overlay" id="cart-overlay">
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer-head">
      <h3>Your Cart (<span id="cart-count">0</span>)</h3>
      <button class="cart-drawer-close" id="cart-close" aria-label="Close cart">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-total"><span>Total</span><span id="cart-total">$0</span></div>
      <div class="cart-note">100% of proceeds support Cat's Meow Cat Rescue</div>
      <a href="mailto:catsmeowcatrescue@gmail.com?subject=Merch%20Order" class="btn btn--pri btn--lg btn--pill" style="width:100%;justify-content:center">Email Us to Order</a>
      <button class="btn btn--outline btn--sm btn--pill" id="cart-clear" style="width:100%;justify-content:center;margin-top:.5rem">Clear Cart</button>
    </div>
  </div>
</div>

<script>
var PRODUCTS=[
{name:"Classic Logo Tee",type:"tees",price:22,grad:"linear-gradient(135deg,#C4291C,#A31F15)",design:"Cat's Meow",sub:"Classic Tee",sizes:true,img:'logo-cats-128.png'},
{name:"Rescue Squad Tee",type:"tees",price:25,grad:"linear-gradient(135deg,#D4A017,#B8890F)",design:"Rescue Squad",sub:"Premium Tee",sizes:true,img:'logo-cats-128.png'},
{name:"Adopt Don't Shop Tee",type:"tees",price:22,grad:"linear-gradient(135deg,#2E7D32,#1B5E20)",design:"Adopt Don't Shop",sub:"Unisex Tee",sizes:true,img:'logo-cats-128.png'},
{name:"PNW Cat Lover Tee",type:"tees",price:28,grad:"linear-gradient(135deg,#8B2500,#C4291C)",design:"PNW Cat Lover",sub:"Limited Edition",sizes:true,img:'logo-cats-128.png'},
{name:"Oregon Coast Crew",type:"sweats",price:45,grad:"linear-gradient(135deg,#6A1B9A,#9C27B0)",design:"Oregon Coast",sub:"Purple Crewneck",sizes:true,img:'logo-cats-128.png'},
{name:"Cat's Meow Hoodie",type:"sweats",price:52,grad:"linear-gradient(135deg,#1E293B,#334155)",design:"Cat's Meow",sub:"Pullover Hoodie",sizes:true,img:'logo-cats-128.png'},
{name:"Paw Print Sticker",type:"stickers",price:3,grad:"linear-gradient(135deg,#D4A017,#E8B830)",design:"Paw Print",sub:"Vinyl Sticker",img:'logo-cats-128.png'},
{name:"Logo Sticker",type:"stickers",price:4,grad:"linear-gradient(135deg,#C4291C,#E04A3E)",design:"Logo",sub:"Die-Cut Sticker",img:'logo-cats-128.png'},
{name:"Adopt Don't Shop Sticker",type:"stickers",price:5,grad:"linear-gradient(135deg,#D4A017,#C4291C)",design:"Adopt Don't Shop",sub:"Bumper Sticker",img:'logo-cats-128.png'},
{name:"Logo Magnet",type:"magnets",price:6,grad:"linear-gradient(135deg,#C4291C,#D4A017)",design:"Cat's Meow",sub:"Fridge Magnet",img:'logo-cats-128.png'},
{name:"My Cat Runs This House",type:"magnets",price:8,grad:"linear-gradient(135deg,#D4A017,#E8B830)",design:"My Cat Runs\nThis House",sub:"Magnet",img:'logo-cats-128.png'}
];

var shopFilter='all';
function renderShop(){
  var items=shopFilter==='all'?PRODUCTS:PRODUCTS.filter(function(p){return p.type===shopFilter});
  document.getElementById('shop-count').textContent=items.length+' product'+(items.length!==1?'s':'');
  document.getElementById('shop-grid').innerHTML=items.map(function(p,idx){
    var sizeHtml='';
    if(p.sizes)sizeHtml='<div class="size-selector"><select class="size-select"><option value="S">S</option><option value="M">M</option><option value="L" selected>L</option><option value="XL">XL</option><option value="2XL">2XL</option><option value="3XL">3XL</option></select></div>';
    var imgHtml=p.img?'<img src="'+p.img+'" alt="'+p.name+'" loading="lazy">':'';
    return '<div class="product-card"><div class="product-img" style="background:'+p.grad+'">'+imgHtml+'<div class="design-overlay"><span class="design-text">'+p.design.replace('\n','<br>')+'</span><span class="design-sub">'+p.sub+'</span></div></div><div class="product-body"><h3>'+p.name+'</h3><span class="product-price">$'+p.price+'</span>'+sizeHtml+'<button onclick="addToCart('+idx+')" class="btn btn--pri btn--sm btn--pill" style="width:100%;justify-content:center"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Add to Cart</button></div></div>';
  }).join('');
}

document.querySelector('.shop-filters').addEventListener('click',function(e){
  var tab=e.target.closest('.shop-tab');if(!tab)return;
  shopFilter=tab.dataset.tab;
  document.querySelectorAll('.shop-tab').forEach(function(t){t.classList.toggle('active',t===tab)});
  renderShop();
});

renderShop();

var cart=[];
function addToCart(idx){
  var p=PRODUCTS[idx];
  var size='';
  var cards=document.querySelectorAll('.product-card');
  if(cards[idx]){var sel=cards[idx].querySelector('.size-select');if(sel)size=sel.value;}
  var key=p.name+(size?'-'+size:'');
  var existing=cart.find(function(c){return c.key===key});
  if(existing){existing.qty++}
  else{cart.push({key:key,name:p.name,price:p.price,size:size,qty:1})}
  renderCart();openCart();
}
function removeFromCart(i){cart.splice(i,1);renderCart()}
function renderCart(){
  var el=document.getElementById('cart-items');
  var badge=document.getElementById('cart-badge');
  var count=document.getElementById('cart-count');
  var footer=document.getElementById('cart-footer');
  var total=0;var qty=0;
  cart.forEach(function(c){total+=c.price*c.qty;qty+=c.qty});
  if(badge){badge.textContent=qty;badge.classList.toggle('has-items',qty>0)}
  if(count)count.textContent=qty;
  if(!cart.length){
    el.innerHTML='<div class="cart-empty"><p>Your cart is empty</p><p style="font-size:.8rem;margin-top:.5rem">Browse our merch above!</p></div>';
    footer.style.display='none';return;
  }
  footer.style.display='';
  document.getElementById('cart-total').textContent='$'+total;
  el.innerHTML=cart.map(function(c,i){
    return '<div class="cart-item"><div class="cart-item-info"><h4>'+c.name+'</h4>'+(c.size?'<span class="cart-item-detail">Size: '+c.size+'</span>':'')+'<span class="cart-item-detail">Qty: '+c.qty+'</span><div class="cart-item-price">$'+(c.price*c.qty)+'</div></div><button class="cart-item-remove" onclick="removeFromCart('+i+')">Remove</button></div>';
  }).join('');
}
function openCart(){
  document.getElementById('cart-overlay').classList.add('is-open');
  document.body.style.overflow='hidden';
}
function closeCart(){
  document.getElementById('cart-overlay').classList.remove('is-open');
  document.body.style.overflow='';
}
document.getElementById('cart-close').addEventListener('click',closeCart);
document.getElementById('cart-overlay').addEventListener('click',function(e){if(e.target===this)closeCart()});
document.getElementById('cart-clear').addEventListener('click',function(){cart=[];renderCart();closeCart()});
renderCart();
window.addEventListener('DOMContentLoaded',function(){
  var ct=document.getElementById('cart-toggle');
  if(ct) ct.addEventListener('click',openCart);
});


</script>

<script src="components.js" defer></script>
</body>
</html>

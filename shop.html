<style>
:root{--ground:#FFF9F2;--surface:#FFFFFF;--ink:#2D1810;--stone:#746758;--mist:#E8DDD2;--pri:#B22222;--pri-h:#8B1A1A;--gold:#D4A017;--teal:#2A9D8F;--amber:#E76F51;--radius:14px;--radius-pill:999px;--sans:'Montserrat',system-ui,sans-serif;--serif:'Fredoka','Nunito',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{padding-top:3.75rem;font-family:var(--sans);overflow-x:hidden;background:var(--ground);color:var(--ink);line-height:1.6}
a{text-decoration:none;color:inherit}
.site-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;border-bottom:1px solid var(--mist)}
.site-header.scrolled{box-shadow:0 1px 12px rgba(0,0,0,.08)}
.header-inner{width:min(76rem,calc(100% - 2rem));margin:0 auto;display:flex;align-items:center;height:3.75rem;gap:1.5rem}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem;flex-shrink:0}
.logo-img{height:44px;width:auto}
.main-nav{display:flex;gap:1.25rem;margin-left:auto}
.main-nav a{font-size:.82rem;font-weight:600;color:var(--ink);transition:color .2s;letter-spacing:.03em;text-transform:uppercase}
.main-nav a:hover{color:var(--pri)}
.header-cta{margin-left:.5rem}
.cart-toggle{position:relative;width:44px;height:44px;display:grid;place-items:center;flex-shrink:0}
.cart-toggle svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cart-badge{position:absolute;top:4px;right:2px;background:var(--pri);color:#fff;font-size:.6rem;font-weight:800;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;line-height:1;opacity:0;transform:scale(0);transition:all .25s}
.cart-badge.has-items{opacity:1;transform:scale(1)}
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:210;opacity:0;visibility:hidden;transition:all .3s}
.cart-overlay.is-open{opacity:1;visibility:visible}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;width:min(26rem,100vw);background:var(--surface);z-index:211;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.cart-overlay.is-open .cart-drawer{transform:translateX(0)}
.cart-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--mist)}
.cart-drawer-head h3{font-family:var(--serif);font-size:1.3rem;font-weight:700}
.cart-drawer-close{width:36px;height:36px;display:grid;place-items:center;font-size:1.5rem;border-radius:50%;transition:background .15s}
.cart-drawer-close:hover{background:var(--mist)}
.cart-items{flex:1;overflow-y:auto;padding:1rem 1.5rem}
.cart-item{display:flex;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--mist)}
.cart-item-info{flex:1}
.cart-item-info h4{font-size:.9rem;margin-bottom:.2rem}
.cart-item-info .cart-item-detail{font-size:.75rem;color:var(--stone)}
.cart-item-info .cart-item-price{font-weight:700;color:var(--pri);font-size:.95rem;margin-top:.25rem}
.cart-item-remove{font-size:.72rem;color:var(--stone);cursor:pointer;align-self:center;padding:.25rem .5rem;border-radius:4px;transition:all .15s}
.cart-item-remove:hover{background:var(--mist);color:var(--pri)}
.cart-empty{text-align:center;padding:3rem 1rem;color:var(--stone)}
.cart-footer{border-top:2px solid var(--mist);padding:1.25rem 1.5rem}
.cart-total{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin-bottom:1rem}
.cart-note{font-size:.72rem;color:var(--stone);text-align:center;margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:10px;font-weight:600;font-size:.9rem;transition:all .2s;white-space:nowrap}
.btn--rose{background:var(--pri);color:#fff}.btn--rose:hover{background:var(--pri-h)}
.btn--pri{background:var(--pri);color:#fff}.btn--pri:hover{background:var(--pri-h)}
.btn--sm{padding:.45rem 1rem;font-size:.8rem}
.btn--pill{border-radius:var(--radius-pill)}
.btn--outline{border:1.5px solid var(--mist);background:transparent;color:var(--ink)}.btn--outline:hover{border-color:var(--pri);color:var(--pri)}
.nav-toggle{display:none;flex-direction:column;gap:5px;padding:10px;margin-left:auto;z-index:110;width:48px;height:48px;justify-content:center;align-items:center;border:none;background:none;cursor:pointer}
.nav-toggle span{display:block;height:2px;background:var(--ink);border-radius:2px;transition:all .35s cubic-bezier(.4,0,.2,1)}
.nav-toggle span:nth-child(1){width:24px}
.nav-toggle span:nth-child(2){width:18px;margin-left:auto}
.nav-toggle span:nth-child(3){width:22px}
.nav-toggle.is-open span:nth-child(1){width:22px;transform:rotate(45deg) translate(5px,5px)}
.nav-toggle.is-open span:nth-child(2){opacity:0;width:0}
.nav-toggle.is-open span:nth-child(3){width:22px;transform:rotate(-45deg) translate(5px,-5px)}
.mobile-nav{position:fixed;inset:0;background:var(--surface);z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .35s cubic-bezier(.4,0,.2,1);transform:translateY(-12px)}
.mobile-nav.is-open{opacity:1;visibility:visible;transform:translateY(0)}
.mobile-nav nav{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;max-width:320px}
.mobile-nav nav a{font-family:var(--serif);font-size:1.4rem;font-weight:700;color:var(--ink);padding:18px 0;min-height:52px;display:flex;align-items:center;width:100%;justify-content:center;border-bottom:1px solid var(--mist);letter-spacing:-.01em;transition:color .2s}
.mobile-nav nav a:last-child{border-bottom:none}
.mobile-nav nav a:hover,.mobile-nav nav a:active{color:var(--pri)}
.mobile-nav .btn--rose{margin-top:1.5rem;width:100%;justify-content:center;min-height:52px;font-size:1.05rem;border-radius:var(--radius-pill)}
.nav-dropdown{position:relative;display:flex;align-items:center}
.nav-dropdown>a{display:flex;align-items:center;gap:.3rem}
.nav-dropdown>a::after{content:'';border:solid var(--ink);border-width:0 1.5px 1.5px 0;display:inline-block;padding:2px;transform:rotate(45deg);margin-top:-2px;transition:transform .2s}
.nav-dropdown:hover>a::after{transform:rotate(-135deg)}
.nav-dropdown-menu{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--mist);border-radius:10px;padding:.5rem 0;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.1);opacity:0;visibility:hidden;transition:all .2s;z-index:120}
.nav-dropdown:hover .nav-dropdown-menu{opacity:1;visibility:visible}
.nav-dropdown-menu a{display:block;padding:.5rem 1.25rem;font-size:.8rem;font-weight:500;color:var(--ink)!important;text-transform:none!important;letter-spacing:0!important;transition:background .15s,color .15s}
.nav-dropdown-menu a:hover{background:var(--ground);color:var(--pri)!important}
/* Force light theme on mobile */
@media(max-width:960px) and (prefers-color-scheme:dark){
  :root{--ground:#FFF9F2;--surface:#FFFFFF;--ink:#2D1810;--stone:#746758;--mist:#E8DDD2;--header-bg:#fff;--header-ink:#2D1810;--header-border:#E8DDD2}
}
@media(max-width:960px){
  :root[data-theme="dark"]{--ground:#FFF9F2;--surface:#FFFFFF;--ink:#2D1810;--stone:#746758;--mist:#E8DDD2;--header-bg:#fff;--header-ink:#2D1810;--header-border:#E8DDD2}
}
@media(max-width:960px){
  .main-nav,.header-cta{display:none}
  .nav-toggle{display:flex;order:2}
  .cart-toggle{order:1;margin-left:auto}
  .site-header{background:#fff!important;border-bottom:1px solid #E8DDD2!important}
  .site-header .logo{color:#2D1810}
  .nav-toggle span{background:#2D1810!important}
  .cart-toggle svg{stroke:#2D1810!important}
  body{padding-bottom:72px}
  .footer-grid{grid-template-columns:1fr 1fr;gap:1.5rem}
}
@media(max-width:640px){
  .footer-grid{grid-template-columns:1fr}
  .footer-bottom{flex-direction:column;text-align:center}
}

.shop-hero{background:linear-gradient(135deg,var(--pri),#D43030);color:#fff;padding:clamp(2.5rem,5vw,4rem) clamp(1rem,4vw,3rem);text-align:center}
.shop-hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:.5rem}
.shop-hero p{opacity:.85;max-width:32rem;margin:0 auto;font-size:1rem}
.container{width:min(76rem,calc(100% - 2rem));margin:0 auto}
.shop-filters{display:flex;gap:.75rem;flex-wrap:wrap;padding:1.5rem 0;border-bottom:1px solid var(--mist);margin-bottom:2rem;align-items:center}
.filter-label{font-size:.82rem;font-weight:700;color:var(--ink);margin-right:.25rem}
.shop-tab{padding:.45rem 1.25rem;border-radius:var(--radius-pill);font-size:.82rem;font-weight:600;border:1.5px solid var(--mist);background:transparent;color:var(--ink);cursor:pointer;transition:all .2s}
.shop-tab:hover{border-color:var(--pri);color:var(--pri)}
.shop-tab.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;padding-bottom:3rem}
.product-card{background:var(--surface);border:1px solid var(--mist);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s}
.product-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.product-img{height:220px;display:flex;align-items:flex-end;justify-content:center;padding:1rem;position:relative;overflow:hidden}
.product-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.design-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:1rem;color:#fff;text-align:center}
.design-text{font-family:var(--serif);font-size:1.4rem;font-weight:800;z-index:2;position:relative;text-shadow:0 2px 8px rgba(0,0,0,.5);letter-spacing:-.02em}
.product-img .design-sub{font-size:.75rem;opacity:.9;font-weight:600;text-transform:uppercase;letter-spacing:.1em;z-index:2;position:relative;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.design-overlay{background:linear-gradient(0deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.35) 100%)}
.product-body{padding:1.25rem}
.product-body h3{font-size:1rem;margin-bottom:.2rem;color:var(--ink)}
.product-price{font-size:1.1rem;font-weight:800;color:var(--pri);display:block;margin-bottom:.75rem}
.size-selector{margin-bottom:.75rem}
.size-select{width:100%;padding:.5rem .75rem;border-radius:8px;border:1.5px solid var(--mist);font-size:.82rem;font-weight:600;color:var(--ink);background:var(--surface);cursor:pointer;transition:border-color .15s;font-family:inherit;appearance:auto}
.size-select:hover,.size-select:focus{border-color:var(--pri);outline:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.shop-count{font-size:.85rem;color:var(--stone);margin-left:auto}
.site-footer{background:#F5EDE5;color:#2D1810;padding:clamp(3rem,5vw,4rem) 0 1.5rem;margin-top:clamp(3rem,6vw,5rem)}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:2.5rem;margin-bottom:2.5rem}
.footer-brand .logo{color:#2D1810;margin-bottom:.75rem}
.footer-brand .logo-img{height:50px;width:auto}
.footer-tagline{font-size:.9rem;opacity:.6;margin-bottom:1rem;line-height:1.6}
.footer-social{display:flex;gap:.6rem}
.footer-social a{width:2rem;height:2rem;border:1px solid rgba(0,0,0,.12);border-radius:50%;display:grid;place-items:center;transition:all .2s}
.footer-social a:hover{border-color:var(--pri);background:rgba(0,0,0,.05)}
.footer-social svg{width:.9rem;height:.9rem}
.footer-col h4{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:1rem;opacity:.4}
.footer-col ul{list-style:none}
.footer-col li{margin-bottom:.4rem}
.footer-col a{font-size:.85rem;opacity:.6;transition:opacity .2s}
.footer-col a:hover{opacity:1}
.footer-bottom{border-top:1px solid rgba(0,0,0,.08);padding-top:1.25rem;display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--stone);flex-wrap:wrap;gap:.5rem}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr 1fr;gap:1.5rem}.footer-brand{grid-column:1/-1}}
@media(max-width:480px){.footer-grid{grid-template-columns:1fr}}
@media(max-width:640px){.shop-grid{grid-template-columns:1fr 1fr;gap:1rem}.product-img{height:180px}}
@media(max-width:380px){.shop-grid{grid-template-columns:1fr}}

.mobile-bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:none;background:#fff;padding:10px 16px;gap:10px;border-top:1px solid #E8DDD2;box-shadow:0 -4px 20px rgba(0,0,0,.1)}

var shopFilter='all';
function renderShop(){
  var items=shopFilter==='all'?PRODUCTS:PRODUCTS.filter(function(p){return p.type===shopFilter});
  document.getElementById('shop-count').textContent=items.length+' product'+(items.length!==1?'s':'');
  document.getElementById('shop-grid').innerHTML=items.map(function(p,idx){
    var sizeHtml='';
    if(p.sizes)sizeHtml='<div class="size-selector"><select class="size-select"><option value="S">S</option><option value="M">M</option><option value="L" selected>L</option><option value="XL">XL</option><option value="2XL">2XL</option><option value="3XL">3XL</option></select></div>';
    var imgHtml=p.img?'<img src="'+p.img+'" alt="'+p.name+'" loading="lazy">':'';
    return '<div class="product-card"><div class="product-img" style="background:'+p.grad+'">'+imgHtml+'<div class="design-overlay"><span class="design-text">'+p.design.replace('\n','<br>')+'</span><span class="design-sub">'+p.sub+'</span></div></div><div class="product-body"><h3>'+p.name+'</h3><span class="product-price">$'+p.price+'</span>'+sizeHtml+'<button onclick="addToCart('+idx+')" class="btn btn--pri btn--sm btn--pill" style="width:100%;justify-content:center"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Add to Cart</button></div></div>';
  }).join('');
}

document.querySelector('.shop-filters').addEventListener('click',function(e){
  var tab=e.target.closest('.shop-tab');if(!tab)return;
  shopFilter=tab.dataset.tab;
  document.querySelectorAll('.shop-tab').forEach(function(t){t.classList.toggle('active',t===tab)});
  renderShop();
});

renderShop();

var cart=[];
function addToCart(idx){
  var p=PRODUCTS[idx];
  var size='';
  var cards=document.querySelectorAll('.product-card');
  if(cards[idx]){var sel=cards[idx].querySelector('.size-select');if(sel)size=sel.value;}
  var key=p.name+(size?'-'+size:'');
  var existing=cart.find(function(c){return c.key===key});
  if(existing){existing.qty++}
  else{cart.push({key:key,name:p.name,price:p.price,size:size,qty:1})}
  renderCart();openCart();
}
function removeFromCart(i){cart.splice(i,1);renderCart()}
function renderCart(){
  var el=document.getElementById('cart-items');
  var badge=document.getElementById('cart-badge');
  var count=document.getElementById('cart-count');
  var footer=document.getElementById('cart-footer');
  var total=0;var qty=0;
  cart.forEach(function(c){total+=c.price*c.qty;qty+=c.qty});
  badge.textContent=qty;badge.classList.toggle('has-items',qty>0);
  count.textContent=qty;
  if(!cart.length){
    el.innerHTML='<div class="cart-empty"><p>Your cart is empty</p><p style="font-size:.8rem;margin-top:.5rem">Browse our merch above!</p></div>';
    footer.style.display='none';return;
  }
  footer.style.display='';
  document.getElementById('cart-total').textContent='$'+total;
  el.innerHTML=cart.map(function(c,i){
    return '<div class="cart-item"><div class="cart-item-info"><h4>'+c.name+'</h4>'+(c.size?'<span class="cart-item-detail">Size: '+c.size+'</span>':'')+'<span class="cart-item-detail">Qty: '+c.qty+'</span><div class="cart-item-price">$'+(c.price*c.qty)+'</div></div><button class="cart-item-remove" onclick="removeFromCart('+i+')">Remove</button></div>';
  }).join('');
}
function openCart(){
  document.getElementById('cart-overlay').classList.add('is-open');
  document.body.style.overflow='hidden';
}
function closeCart(){
  document.getElementById('cart-overlay').classList.remove('is-open');
  document.body.style.overflow='';
}
document.getElementById('cart-close').addEventListener('click',closeCart);
document.getElementById('cart-overlay').addEventListener('click',function(e){if(e.target===this)closeCart()});
document.getElementById('cart-clear').addEventListener('click',function(){cart=[];renderCart();closeCart()});
renderCart();
window.addEventListener('DOMContentLoaded',function(){
  var ct=document.getElementById('cart-toggle');
  if(ct) ct.addEventListener('click',openCart);
});


</script>
